services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-financeira-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao}
      POSTGRES_DB: ${POSTGRES_DB:-gestao_financeira}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_financeira"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
